<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Helper Books</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* =========================================================================
   Finance Helper Books — "Ledger, modernised"
   Aurora palette: navy, teal and blue with warm accents. Same markup, same behaviour.
   ========================================================================= */
:root {
  color-scheme: light;
  --bg:#F1F6F8; --surface:#FFFFFF; --surface2:#F5F9FB; --ink:#0D1B2A; --muted:#566677;
  --line:#DEE8EC; --line-soft:#EAF1F4; --ledger:#E6F0F3;
  --accent:#0B8577; --accent-2:#2563EB; --accent-ink:#FFFFFF; --accent-soft:#DFF4F0;
  --on-accent:#FFFFFF; --on-bad:#FFFFFF;
  --good:#0B7A4F; --good-bg:#DDF5E8; --warn:#9A5A06; --warn-bg:#FEF3DC; --bad:#BE2D3A; --bad-bg:#FDE8EA;
  --c1:#0B8577; --c2:#2563EB; --c3:#E08A12; --c4:#D9466F;
  --side-1:#0B1F33; --side-2:#0F3B4A; --side-ink:#E8F3F6; --side-muted:#8FB0BC; --side-hover:rgba(255,255,255,.09); --side-line:rgba(255,255,255,.08);
  --scrim:rgba(8,18,30,.55);
  --glow-1:rgba(37,99,235,.11); --glow-2:rgba(11,133,119,.13); --glow-3:rgba(251,146,60,.11);
  --shadow-1:0 1px 2px rgba(13,27,42,.05),0 14px 30px -24px rgba(13,27,42,.38);
  --shadow-2:0 30px 70px -30px rgba(13,27,42,.5);
  --head:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --body:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r-lg:16px; --r-md:12px; --r-sm:9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:#060C13; --surface:#0E1822; --surface2:#13202C; --ink:#E6F0F4; --muted:#8FA4B2;
    --line:#1F2E3B; --line-soft:#172330; --ledger:#182733;
    --accent:#3DDBC2; --accent-2:#6BA6FF; --accent-ink:#04151A; --accent-soft:#0F2B2E;
    --on-accent:#04151A; --on-bad:#2B0A0E;
    --good:#5FDBA5; --good-bg:#0D3125; --warn:#F5BE6B; --warn-bg:#33240F; --bad:#FF8F9A; --bad-bg:#3A1A20;
    --c1:#3DDBC2; --c2:#6BA6FF; --c3:#F5B454; --c4:#FF8FAE;
    --side-1:#08131E; --side-2:#0B2430; --side-ink:#E6F0F4; --side-muted:#7E97A6; --side-hover:rgba(255,255,255,.07); --side-line:rgba(255,255,255,.07);
    --scrim:rgba(1,4,8,.72);
    --glow-1:rgba(107,166,255,.10); --glow-2:rgba(61,219,194,.10); --glow-3:rgba(245,180,84,.06);
    --shadow-1:0 1px 2px rgba(0,0,0,.5),0 18px 36px -28px rgba(0,0,0,.95);
    --shadow-2:0 34px 80px -30px rgba(0,0,0,.95);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#060C13; --surface:#0E1822; --surface2:#13202C; --ink:#E6F0F4; --muted:#8FA4B2;
  --line:#1F2E3B; --line-soft:#172330; --ledger:#182733;
  --accent:#3DDBC2; --accent-2:#6BA6FF; --accent-ink:#04151A; --accent-soft:#0F2B2E;
  --on-accent:#04151A; --on-bad:#2B0A0E;
  --good:#5FDBA5; --good-bg:#0D3125; --warn:#F5BE6B; --warn-bg:#33240F; --bad:#FF8F9A; --bad-bg:#3A1A20;
  --c1:#3DDBC2; --c2:#6BA6FF; --c3:#F5B454; --c4:#FF8FAE;
  --side-1:#08131E; --side-2:#0B2430; --side-ink:#E6F0F4; --side-muted:#7E97A6; --side-hover:rgba(255,255,255,.07); --side-line:rgba(255,255,255,.07);
  --scrim:rgba(1,4,8,.72);
  --glow-1:rgba(107,166,255,.10); --glow-2:rgba(61,219,194,.10); --glow-3:rgba(245,180,84,.06);
  --shadow-1:0 1px 2px rgba(0,0,0,.5),0 18px 36px -28px rgba(0,0,0,.95);
  --shadow-2:0 34px 80px -30px rgba(0,0,0,.95);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(1000px 520px at 100% -10%, var(--glow-1), transparent 62%),
    radial-gradient(820px 440px at -10% 0%, var(--glow-2), transparent 58%);
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--ink);
  font: 14.5px/1.55 var(--body);
  font-feature-settings: "cv11", "ss01";
  padding-block: 24px 56px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--head); margin: 0; text-wrap: balance; letter-spacing: -.022em; }
h1 { font-size: clamp(24px, 2.4vw, 31px); line-height: 1.12; font-weight: 800; }
h2 { font-size: 17px; font-weight: 700; letter-spacing: -.018em; }
h3 { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 2px; }
::selection { background: var(--accent-soft); color: var(--ink); }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------- shell ---------------- */
.shell {
  display: grid; grid-template-columns: 248px minmax(0, 1fr);
  gap: 30px; max-width: 1360px; margin: 0 auto;
}
.side {
  position: sticky; top: 24px; align-self: start;
  max-height: calc(100vh - 48px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px; padding: 14px 12px 16px;
  box-shadow: var(--shadow-1);
  scrollbar-width: thin;
}
.brand { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; padding: 4px 8px 16px; }
.brand::before {
  content: "FH"; grid-row: 1 / span 2;
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px;
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  color: var(--on-accent); font: 800 12px/1 var(--head); letter-spacing: .01em;
  box-shadow: 0 6px 16px -8px rgba(11, 133, 119, .8);
}
.brand b { display: block; font: 800 15px/1.25 var(--head); letter-spacing: -.02em; overflow-wrap: anywhere; }
.brand span { font-size: 11.5px; color: var(--muted); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
.side .menu-btn { display: none; }
.nav-group { margin-top: 10px; }
.nav-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase;
  color: var(--muted); padding: 10px 10px 6px; opacity: .9;
}
.nav a {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 8px 11px; margin-bottom: 2px; border-radius: 10px;
  color: var(--ink); text-decoration: none; font-weight: 600; font-size: 13.5px;
  transition: background .16s ease, color .16s ease, transform .16s ease;
}
.nav a:hover { background: var(--surface2); }
.nav a[aria-current="page"] {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--on-accent); box-shadow: 0 8px 18px -12px rgba(11, 133, 119, .95);
}
.badge {
  min-width: 20px; padding: 0 6px; border-radius: 999px;
  background: var(--bad); color: var(--on-bad);
  font: 700 11px/18px var(--mono); text-align: center;
}
.nav a[aria-current="page"] .badge { background: var(--on-accent); color: var(--accent); }
main { min-width: 0; }

/* ---------------- page head ---------------- */
.top {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 14px 20px; margin-bottom: 20px;
}
.top h1 { background: linear-gradient(180deg, var(--ink), var(--ink) 62%, var(--muted)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.top .sub { color: var(--muted); margin-top: 6px; max-width: 64ch; font-size: 13.5px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.save-chip {
  display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
  color: var(--muted); background: var(--surface); border: 1px solid var(--line);
  padding: 5px 11px; border-radius: 999px; box-shadow: var(--shadow-1);
}
.save-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.save-chip.ok i { background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
.save-chip.bad i { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }
.save-chip.busy i { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

/* ---------------- controls ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 7px 14px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap;
  box-shadow: 0 1px 2px rgba(16, 24, 40, .05);
  transition: border-color .16s ease, box-shadow .16s ease, transform .12s ease, background .16s ease;
}
.btn:hover { border-color: var(--accent); box-shadow: 0 6px 16px -12px rgba(11, 133, 119, .9); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent; color: var(--accent-ink);
  box-shadow: 0 10px 22px -14px rgba(11, 133, 119, 1);
}
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); }
.btn.danger.sure { background: var(--bad); color: var(--on-bad); border-color: var(--bad); }
.btn.sm { min-height: 29px; padding: 3px 10px; font-size: 12.5px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea {
  width: 100%; padding: 8px 11px; min-height: 36px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px;
  transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
}
input:hover, select:hover, textarea:hover { border-color: var(--line-soft); }
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
input[type="checkbox"] { width: 18px; height: 18px; min-height: 0; padding: 0; accent-color: var(--accent); cursor: pointer; border-radius: 5px; }
input[type="date"] { font-family: var(--mono); font-size: 12.5px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 15px, calc(100% - 12px) 15px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
textarea { resize: vertical; min-height: 96px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; }
label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .01em; color: var(--muted); }
label > input, label > select, label > textarea { margin-top: 5px; color: var(--ink); font-weight: 400; }
.field-hint { font-weight: 400; font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 16px; }
.row-flex { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
.row-flex > label { flex: 1 1 150px; }
.check-label { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink); font-weight: 500; }
.check-label input { margin: 0; }

/* ---------------- surfaces ---------------- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow-1);
}
.card > h2 { margin-bottom: 2px; }
.stack { display: grid; gap: 16px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.banner {
  padding: 12px 16px; border-radius: var(--r-md);
  font-weight: 500; display: flex; flex-wrap: wrap; align-items: center;
  gap: 10px 16px; justify-content: space-between;
  border: 1px solid transparent; border-left-width: 3px;
}
.banner.good { background: var(--good-bg); color: var(--good); border-color: var(--good-bg); border-left-color: var(--good); }
.banner.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-bg); border-left-color: var(--bad); }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-bg); border-left-color: var(--warn); }
.banner.info { background: var(--accent-soft); color: var(--ink); border-color: var(--accent-soft); border-left-color: var(--accent); }
.banner b { font-weight: 800; }
.banner .btn { background: var(--surface); }

/* stats: each number becomes its own card with a top accent rule */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; background: none; border: 0; border-radius: 0; overflow: visible; }
.stat {
  position: relative; overflow: hidden; min-width: 0;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 16px 18px 15px;
  box-shadow: var(--shadow-1);
}
.stat::after {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  opacity: .9;
}
.stat .k { font-size: 11.5px; color: var(--muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.stat .v { font: 600 23px/1.22 var(--mono); margin-top: 7px; overflow-wrap: anywhere; letter-spacing: -.03em; }
.stat .v.txt { font: 800 17px/1.3 var(--head); letter-spacing: -.02em; }
.stat .n { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* ---------------- tables ---------------- */
.tablewrap {
  overflow-x: auto; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
}
table.data { border-collapse: collapse; width: 100%; min-width: 620px; }
.data th {
  font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); text-align: left; padding: 12px 14px;
  background: var(--surface2); border-bottom: 1px solid var(--line); white-space: nowrap;
}
.data td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.data tbody tr:last-child td { border-bottom: 0; }
.data tbody tr { transition: background .14s ease; }
.data tbody tr:hover td { background: var(--surface2); }
.data th.num, .data td.num { text-align: right; }
.data td.wrap { min-width: 150px; }
.data tfoot td { font-weight: 700; border-top: 1px solid var(--line); border-bottom: 3px double var(--ink); background: var(--surface); }
.data tr.total td { font-weight: 700; border-top: 1px solid var(--line); border-bottom: 3px double var(--ink); }
.data td.act { text-align: right; white-space: nowrap; width: 1%; }
.data td .mute { color: var(--muted); }
.empty { padding: 34px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font: 800 16px var(--head); margin-bottom: 6px; letter-spacing: -.02em; }
.pill {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .01em;
  background: var(--surface2); color: var(--muted);
  border: 1px solid var(--line); white-space: nowrap;
}
.pill.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px; }
.toolbar input[type="search"], .toolbar input[type="text"], .toolbar select { width: auto; min-width: 155px; }
.datebar {
  display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end;
  margin-bottom: 16px; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
}
.datebar label { flex: 0 1 168px; }

/* ---------------- paper (printable pages) ---------------- */
.paper {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; padding: 26px; max-width: 820px; box-shadow: var(--shadow-1);
}
.paper .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.paper .head h2 { font-size: 21px; }
.problem { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.problem:last-child { border-bottom: 0; }
.problem .cnt {
  width: 38px; text-align: center; font: 700 13.5px var(--mono);
  padding: 3px 0; border-radius: 9px; background: var(--surface2); color: var(--muted);
}
.problem .cnt.on { background: var(--bad-bg); color: var(--bad); }
.problem .txt { flex: 1 1 260px; min-width: 0; font-weight: 500; }
.problem .tip { font-size: 12.5px; color: var(--muted); }
.list-plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.list-plain li::marker { color: var(--accent); }
.routine { display: grid; gap: 12px; }
.routine div b { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
pre.prompt {
  margin: 9px 0 0; padding: 14px; background: var(--surface2);
  border: 1px solid var(--line); border-radius: var(--r-md);
  max-height: 260px; overflow: auto; white-space: pre-wrap;
  font: 12px/1.6 var(--mono); color: var(--ink);
}
.explain { white-space: pre-wrap; line-height: 1.65; }

/* ---------------- overlay + toast ---------------- */
.overlay {
  position: fixed; inset: 0; z-index: 50;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
  overflow: auto; display: flex;
  padding: max(18px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  animation: fade .18s ease both;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  margin: auto; width: 100%; max-width: 660px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px; padding: 24px; box-shadow: var(--shadow-2);
  animation: rise .22s cubic-bezier(.2, .8, .3, 1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }
.modal h2 { margin-bottom: 16px; font-size: 19px; }
.modal .btns { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; align-items: center; }
.modal .btns .spacer { flex: 1; }
.form-error { margin-top: 14px; padding: 10px 14px; background: var(--bad-bg); color: var(--bad); border-radius: var(--r-sm); font-weight: 600; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  max-width: min(92vw, 520px);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg);
  padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: 13px;
  box-shadow: var(--shadow-2);
  animation: rise .2s ease both;
}

/* ---------------- reports: bars + groups ---------------- */
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(70px, 28%) minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 13px; }
.bar-l { overflow-wrap: anywhere; color: var(--ink); font-weight: 500; }
.bar-t { height: 10px; background: var(--ledger); border-radius: 999px; overflow: hidden; }
.bar-t i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s ease; }
.bar-t i.out { background: linear-gradient(90deg, var(--warn), var(--bad)); }
.bar-v { font-size: 12.5px; min-width: 80px; text-align: right; }
.mgroup { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.mgroup:last-child { border-bottom: 0; }

/* ---------------- responsive ---------------- */
@media (max-width: 900px) {
  body { padding-block: 16px 40px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }

</style></head><body>
<script>
/* Finance Helper: money logic. Pure functions, no screen code.
   Mirrors the Excel workbook so the numbers match. */
(function (root) {
  'use strict';

  var TYPES = ['Income', 'Expense', 'Equipment', 'Loan in', 'Loan out', 'Owner in', 'Owner out'];
  var DEFAULT_GROUPS = [
    { name: 'Sales', type: 'Income' }, { name: 'Other income', type: 'Income' },
    { name: 'Supplies', type: 'Expense' }, { name: 'Rent', type: 'Expense' },
    { name: 'Utilities', type: 'Expense' }, { name: 'Pay', type: 'Expense' },
    { name: 'Transport', type: 'Expense' }, { name: 'Other expense', type: 'Expense' },
    { name: 'Equipment', type: 'Equipment' }, { name: 'Loan received', type: 'Loan in' },
    { name: 'Loan payment', type: 'Loan out' }, { name: 'Owner puts in money', type: 'Owner in' },
    { name: 'Owner takes out money', type: 'Owner out' }
  ];

  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function r2(n) { return Math.round(n * 100) / 100; }
  function norm(x) { return String(x == null ? '' : x).trim().toUpperCase(); }

  function pd(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN;
  }
  function daysBetween(a, b) { return Math.round((pd(b) - pd(a)) / 864e5); }
  function fmtDate(s) {
    var t = pd(s);
    if (isNaN(t)) return '';
    return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  }
  function fmtDateLong(s) {
    var t = pd(s);
    if (isNaN(t)) return '';
    return new Date(t).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function isoToday() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function monthStart(iso) { return iso.slice(0, 8) + '01'; }
  function monthEnd(iso) {
    var y = +iso.slice(0, 4), m = +iso.slice(5, 7);
    var last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return iso.slice(0, 8) + pad(last);
  }
  function money(n, plain) {
    n = r2(num(n));
    if (Math.abs(n) < 0.005) return plain ? '0.00' : '-';
    var s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return n < 0 ? '(' + s + ')' : s;
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function groupType(s, name) {
    for (var i = 0; i < s.groups.length; i++) if (s.groups[i].name === name) return s.groups[i].type;
    return null;
  }

  function kindOf(r, s) {
    var blank = !r.date && !num(r.in) && !num(r.out);
    if (blank) return '';
    var t = r.group ? groupType(s, r.group) : null;
    if (!t) return 'Needs a group';
    if (t === 'Income') return r.ref ? 'Invoice payment' : 'Cash income';
    if (t === 'Expense') return r.ref ? 'Bill payment' : 'Direct expense';
    return t;
  }

  function compute(book) {
    var s = book.settings;
    var rows = book.rows || [];
    var invIdx = {}, billIdx = {};
    (book.invoices || []).forEach(function (v) { invIdx[norm(v.no)] = v; });
    (book.bills || []).forEach(function (v) { billIdx[norm(v.no)] = v; });

    var dup = {};
    rows.forEach(function (r) {
      var k = [r.date, String(r.who || '').trim().toLowerCase(), num(r.in), num(r.out)].join('|');
      dup[k] = (dup[k] || 0) + 1;
    });

    var limit = num(s.limit);
    var crow = rows.map(function (r) {
      var kind = kindOf(r, s);
      var type = r.group ? groupType(s, r.group) : null;
      var i = num(r.in), o = num(r.out), check = '';
      var cust = '';
      if (kind === 'Invoice payment' && invIdx[norm(r.ref)]) cust = invIdx[norm(r.ref)].cust;
      if (kind !== '') {
        if (!r.date) check = 'No date';
        else if (i > 0 && o > 0) check = 'Money in and out on one row';
        else if (i + o === 0) check = 'No amount';
        else if (r.date < s.start) check = 'Date is before records start';
        else if (r.status === 'NOT SURE') check = 'Not sure - a person must look';
        else if (kind === 'Needs a group') check = 'Needs a group';
        else if (((type === 'Income' || type === 'Loan in' || type === 'Owner in') && o > 0) ||
                 ((type === 'Expense' || type === 'Equipment' || type === 'Loan out' || type === 'Owner out') && i > 0)) {
          check = 'Money direction does not match the group';
        } else if (kind === 'Invoice payment' && !invIdx[norm(r.ref)]) check = 'Invoice # not found';
        else if (kind === 'Bill payment' && !billIdx[norm(r.ref)]) check = 'Bill # not found';
        else if (i > limit || o > limit) check = 'Over the limit - a person must check';
        else if (dup[[r.date, String(r.who || '').trim().toLowerCase(), i, o].join('|')] > 1) check = 'Possible duplicate';
        else if (r.status === 'DUPLICATE?') check = 'Marked duplicate - a person must look';
        else check = 'OK';
      }
      return { r: r, kind: kind, type: type, check: check, cust: cust };
    });

    // ---- invoices
    var paidInv = {}, paidBill = {};
    crow.forEach(function (c) {
      if (!c.r.date || c.r.date > s.asOf) return;
      if (c.kind === 'Invoice payment') paidInv[norm(c.r.ref)] = (paidInv[norm(c.r.ref)] || 0) + num(c.r.in);
      if (c.kind === 'Bill payment') paidBill[norm(c.r.ref)] = (paidBill[norm(c.r.ref)] || 0) + num(c.r.out);
    });
    var custName = {};
    (book.customers || []).forEach(function (c) { custName[c.id] = c.name; });

    function status(date, owed, paid) {
      if (date > s.asOf) return 'Not billed yet';
      if (owed < -0.005) return 'Overpaid - check';
      if (owed <= 0.005) return 'Paid';
      return paid > 0.005 ? 'Part paid' : 'Unpaid';
    }
    var invoices = (book.invoices || []).map(function (v) {
      var paid = paidInv[norm(v.no)] || 0;
      var owed = v.date > s.asOf ? 0 : num(v.amount) - paid;
      return {
        v: v, paid: paid, owed: owed, status: status(v.date, owed, paid),
        days: owed > 0.005 ? daysBetween(v.due, s.asOf) : null,
        custName: custName[v.cust] || null
      };
    });
    var bills = (book.bills || []).map(function (v) {
      var paid = paidBill[norm(v.no)] || 0;
      var owed = v.date > s.asOf ? 0 : num(v.amount) - paid;
      return {
        v: v, paid: paid, owed: owed, status: status(v.date, owed, paid),
        days: owed > 0.005 ? daysBetween(v.due, s.asOf) : null,
        groupOk: groupType(s, v.group) === 'Expense'
      };
    });

    var customers = (book.customers || []).map(function (c) {
      var billed = 0, paid = 0;
      invoices.forEach(function (iv) {
        if (iv.v.cust !== c.id) return;
        if (iv.v.date <= s.asOf) billed += num(iv.v.amount);
        paid += iv.paid;
      });
      return { c: c, billed: billed, paid: paid, owed: billed - paid };
    });

    // ---- range sums over the daily record
    function sum(field, kinds, from, to, toExcl) {
      var total = 0;
      for (var i = 0; i < crow.length; i++) {
        var c = crow[i], d = c.r.date;
        if (!d) continue;
        if (d < from) continue;
        if (toExcl ? d >= to : d > to) continue;
        if (kinds && [].concat(kinds).indexOf(c.kind) < 0) continue;
        total += num(c.r[field]);
      }
      return total;
    }
    function invBilled(from, to) {
      var t = 0;
      invoices.forEach(function (x) { if (x.v.date >= from && x.v.date <= to) t += num(x.v.amount); });
      return t;
    }
    function billBilled(from, to) {
      var t = 0;
      bills.forEach(function (x) { if (x.v.date >= from && x.v.date <= to) t += num(x.v.amount); });
      return t;
    }

    // ---- balance sheet
    var openRecv = 0, openBills = 0;
    invoices.forEach(function (x) { if (x.v.date < s.start) openRecv += num(x.v.amount); });
    bills.forEach(function (x) { if (x.v.date < s.start) openBills += num(x.v.amount); });
    var openEquity = num(s.openCash) + openRecv + num(s.openEquip) - openBills - num(s.openLoan);
    var earned = invBilled(s.start, s.asOf) + sum('in', 'Cash income', s.start, s.asOf);
    var spent = billBilled(s.start, s.asOf) + sum('out', 'Direct expense', s.start, s.asOf);
    var profitSince = earned - spent;
    var ownerIn = sum('in', 'Owner in', s.start, s.asOf), ownerOut = sum('out', 'Owner out', s.start, s.asOf);
    var bsCash = num(s.openCash) + sum('in', null, s.start, s.asOf) - sum('out', null, s.start, s.asOf);
    var bsRecv = 0, bsBills = 0;
    invoices.forEach(function (x) { bsRecv += x.owed; });
    bills.forEach(function (x) { bsBills += x.owed; });
    var bsEquip = num(s.openEquip) + sum('out', 'Equipment', s.start, s.asOf);
    var bsLoan = num(s.openLoan) + sum('in', 'Loan in', s.start, s.asOf) - sum('out', 'Loan out', s.start, s.asOf);
    var bsEquity = openEquity + ownerIn - ownerOut + profitSince;
    var totalOwn = bsCash + bsRecv + bsEquip;
    var totalOwe = bsBills + bsLoan + bsEquity;
    var balance = {
      cash: bsCash, recv: bsRecv, equip: bsEquip, totalOwn: totalOwn,
      bills: bsBills, loan: bsLoan, equity: bsEquity, totalOwe: totalOwe,
      diff: totalOwn - totalOwe, balanced: Math.abs(totalOwn - totalOwe) < 0.005,
      openEquity: openEquity, ownerIn: ownerIn, ownerOut: ownerOut, profitSince: profitSince, earned: earned, spent: spent
    };

    // ---- profit and loss
    var expGroups = s.groups.filter(function (g) { return g.type === 'Expense'; });
    var plLines = expGroups.map(function (g) {
      var t = 0;
      bills.forEach(function (x) { if (x.v.group === g.name && x.v.date >= s.pStart && x.v.date <= s.pEnd) t += num(x.v.amount); });
      crow.forEach(function (c) {
        if (c.kind === 'Direct expense' && c.r.group === g.name && c.r.date >= s.pStart && c.r.date <= s.pEnd) t += num(c.r.out);
      });
      return { name: g.name, amount: t };
    });
    var plBilled = invBilled(s.pStart, s.pEnd);
    var plCashInc = sum('in', 'Cash income', s.pStart, s.pEnd);
    var plSpent = billBilled(s.pStart, s.pEnd) + sum('out', 'Direct expense', s.pStart, s.pEnd);
    var plListed = plLines.reduce(function (a, l) { return a + l.amount; }, 0);
    var pl = {
      billed: plBilled, cashIncome: plCashInc, earned: plBilled + plCashInc,
      lines: plLines, other: plSpent - plListed, spent: plSpent, profit: plBilled + plCashInc - plSpent
    };

    // ---- cash flow
    var cfOpen = num(s.openCash) + sum('in', null, s.start, s.pStart, true) - sum('out', null, s.start, s.pStart, true);
    var cfIn = {
      invoice: sum('in', 'Invoice payment', s.pStart, s.pEnd), cash: sum('in', 'Cash income', s.pStart, s.pEnd),
      loan: sum('in', 'Loan in', s.pStart, s.pEnd), owner: sum('in', 'Owner in', s.pStart, s.pEnd)
    };
    cfIn.total = sum('in', null, s.pStart, s.pEnd);
    cfIn.unsorted = cfIn.total - cfIn.invoice - cfIn.cash - cfIn.loan - cfIn.owner;
    var cfOut = {
      bills: sum('out', 'Bill payment', s.pStart, s.pEnd), direct: sum('out', 'Direct expense', s.pStart, s.pEnd),
      equip: sum('out', 'Equipment', s.pStart, s.pEnd), loan: sum('out', 'Loan out', s.pStart, s.pEnd),
      owner: sum('out', 'Owner out', s.pStart, s.pEnd)
    };
    cfOut.total = sum('out', null, s.pStart, s.pEnd);
    cfOut.unsorted = cfOut.total - cfOut.bills - cfOut.direct - cfOut.equip - cfOut.loan - cfOut.owner;
    var cfEnd = cfOpen + cfIn.total - cfOut.total;
    var cf = {
      open: cfOpen, inn: cfIn, out: cfOut, end: cfEnd, bsCash: bsCash,
      sameDate: s.pEnd === s.asOf, matches: Math.abs(cfEnd - bsCash) < 0.005
    };

    // ---- daily note counts
    function cnt(fn) { var n = 0; crow.forEach(function (c) { if (c.check && fn(c.check)) n++; }); return n; }
    var notApproved = 0;
    crow.forEach(function (c) { if (c.kind !== '' && c.r.approved !== true) notApproved++; });
    var problems = [
      { id: 'notsure', label: 'Rows marked NOT SURE', n: cnt(function (t) { return t.indexOf('Not sure') === 0; }), tip: 'Look at the paper. Fix the row, then set Status to OK.' },
      { id: 'group', label: 'Rows that need a group', n: cnt(function (t) { return t === 'Needs a group'; }), tip: 'Pick a group for the row.' },
      { id: 'dup', label: 'Possible duplicates', n: cnt(function (t) { return t === 'Possible duplicate' || t.indexOf('Marked duplicate') === 0; }), tip: 'Same date, name, and amount twice. Delete one if it is a repeat.' },
      { id: 'limit', label: 'Amounts over your limit', n: cnt(function (t) { return t.indexOf('Over the limit') === 0; }), tip: 'A person must look at these before approving.' },
      { id: 'notfound', label: 'Invoice or bill numbers not found', n: cnt(function (t) { return t === 'Invoice # not found' || t === 'Bill # not found'; }), tip: 'Add the invoice or bill, or fix the number.' },
      { id: 'other', label: 'Other row problems (no date, no amount, date too early, in and out)', n: cnt(function (t) { return t === 'No date' || t === 'No amount' || t.indexOf('Date is before') === 0 || t.indexOf('Money in and out') === 0 || t.indexOf('Money direction') === 0; }), tip: 'Open the row and read its Check.' },
      { id: 'approve', label: 'Rows not approved yet', n: notApproved, tip: 'A person approves each row after looking at it.' },
      { id: 'balance', label: 'Balance sheet is out of balance', n: balance.balanced ? 0 : 1, tip: 'Do not use the reports. Find the row or number that is wrong.' },
      { id: 'billgroup', label: 'Bills with a group that is not an Expense group', n: bills.filter(function (b) { return !b.groupOk; }).length, tip: 'Fix the group on the Bills page.' },
      { id: 'custid', label: 'Invoices with an unknown Customer ID', n: invoices.filter(function (x) { return !x.custName; }).length, tip: 'Add the customer on the Customers page.' }
    ];
    var needPerson = problems.reduce(function (a, p) { return a + p.n; }, 0);

    var openInv = invoices.filter(function (x) { return x.days !== null; });
    var openBill = bills.filter(function (x) { return x.days !== null; });
    openInv.sort(function (a, b) { return b.days - a.days; });
    openBill.sort(function (a, b) { return b.days - a.days; });

    var mistakesInMonth = (book.mistakes || []).filter(function (m) { return m.date >= s.pStart && m.date <= s.pEnd; }).length;

    // ---- month end
    var me = book.monthEnd || {};
    var adjBank = num(me.bank) + num(me.addIn) - num(me.subOut);
    var bankDiff = adjBank - bsCash;
    var auto = [
      problems[6].n === 0, problems[0].n === 0,
      problems[2].n + problems[3].n + problems[4].n + problems[5].n + problems[1].n === 0,
      Math.abs(bankDiff) < 0.005, balance.balanced
    ];

    return {
      crow: crow, invoices: invoices, bills: bills, customers: customers,
      balance: balance, pl: pl, cf: cf, problems: problems, needPerson: needPerson,
      openInv: openInv, openBill: openBill, mistakesInMonth: mistakesInMonth,
      totalOwedToUs: invoices.reduce(function (a, x) { return a + x.owed; }, 0),
      totalWeOwe: bills.reduce(function (a, x) { return a + x.owed; }, 0),
      month: { adjBank: adjBank, bankDiff: bankDiff, bankOk: Math.abs(bankDiff) < 0.005, auto: auto },
      invIdx: invIdx, billIdx: billIdx,
      dayTotals: function (d) {
        var i = 0, o = 0, n = 0, na = 0;
        crow.forEach(function (c) {
          if (c.r.date === d) { i += num(c.r.in); o += num(c.r.out); n++; if (c.kind !== '' && c.r.approved !== true) na++; }
        });
        return { inn: i, out: o, left: i - o, n: n, notApproved: na };
      },
      statement: function (custId) {
        var lines = [];
        invoices.forEach(function (x, idx) {
          if (x.v.cust === custId && x.v.date <= s.asOf) lines.push({ date: x.v.date, text: 'Invoice ' + x.v.no, added: num(x.v.amount), paid: 0, ord: 0, idx: idx });
        });
        crow.forEach(function (c, idx) {
          if (c.kind === 'Invoice payment' && c.cust === custId && c.r.date && c.r.date <= s.asOf) {
            lines.push({ date: c.r.date, text: 'Payment received for ' + c.r.ref, added: 0, paid: num(c.r.in), ord: 1, idx: idx });
          }
        });
        lines.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.ord - b.ord || a.idx - b.idx; });
        var run = 0, ta = 0, tp = 0;
        lines.forEach(function (l) { run += l.added - l.paid; l.owed = run; ta += l.added; tp += l.paid; });
        var cu = customers.filter(function (c) { return c.c.id === custId; })[0];
        return { lines: lines, totalAdded: ta, totalPaid: tp, owed: ta - tp, custOwed: cu ? cu.owed : 0, matches: Math.abs(ta - tp - (cu ? cu.owed : 0)) < 0.005 };
      }
    };
  }

  // ---------- starting data
  function blankBook() {
    var today = isoToday();
    return {

  if (f.t === 'check') return '<label class="check-label" style="grid-column:1/-1"><input type="checkbox" name="' + f.k + '"' + (val ? ' checked' : '') + '> ' + esc(f.l) + '</label>';
  var h = '<label>' + esc(f.l) + (f.req ? ' *' : '');
  if (f.t === 'select') {
    var opts = f.optsKV || (f.opts || []).map(function (o) { return [o, o]; });
    h += '<select name="' + f.k + '">';
    if (f.blank) h += '<option value="">' + esc(f.blank) + '</option>';
    var seen = false;
    opts.forEach(function (o) { var sel = String(o[0]) === String(val); if (sel) seen = true; h += '<option value="' + esc(o[0]) + '"' + (sel ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; });
    if (val && !seen) h += '<option value="' + esc(val) + '" selected>' + esc(val) + ' (not in the list)</option>';
    h += '</select>';
  } else {
    var shown = (f.t === 'number' && (val === 0 || val === undefined || val === null)) ? '' : (val == null ? '' : val);
    h += '<input name="' + f.k + '" type="' + f.t + '"' + (f.t === 'number' ? ' step="any" inputmode="decimal"' : '') + (f.list ? ' list="' + f.list + '"' : '') + ' value="' + esc(shown) + '" autocomplete="off">';
  }
  if (f.hint) h += '<span class="field-hint">' + esc(f.hint) + '</span>';
  return h + '</label>';
}
function openForm(kind, item, isNew) {
  var F = FORMS[kind], d = isNew ? F.blank() : item, fields = F.fields();
  var refs = book.invoices.map(function (x) { return x.no; }).concat(book.bills.map(function (x) { return x.no; }));
  var html = '<h2>' + (isNew ? 'Add ' : 'Edit ') + esc(F.title.toLowerCase()) + '</h2><form id="theform" novalidate><div class="grid">' +
    fields.map(function (f) { return fieldHtml(f, d); }).join('') + '</div>' +
    '<datalist id="refs">' + refs.map(function (r) { return '<option value="' + esc(r) + '">'; }).join('') + '</datalist>' +
    '<div class="form-error" id="ferr" role="alert" hidden></div>' +
    '<div class="btns"><button class="btn primary" type="submit">Save</button>' +
    (isNew && (kind === 'row' || kind === 'invoice' || kind === 'bill') ? '<button class="btn" type="button" data-m="again">Save and add another</button>' : '') +
    '<span class="spacer"></span><button class="btn" type="button" data-m="close">Cancel</button></div></form>';
  openModal(html, function (m) {
    var form = $('#theform', m), err = $('#ferr', m);
    function collect() {
      var v = {};
      fields.forEach(function (f) {
        var el = form.elements[f.k];
        if (f.t === 'check') v[f.k] = el.checked;
        else if (f.t === 'number') v[f.k] = el.value === '' ? 0 : FH.num(el.value);
        else v[f.k] = el.value;
      });
      return v;
    }
    function save(again) {
      var v = collect(), msg = F.validate(v, d, isNew);
      if (msg) { err.textContent = msg; err.hidden = false; return; }
      if (isNew) book[KEY[kind][0]].push(d);
      F.apply(v, d, isNew);
      if (kind === 'row' && v.status === 'OK' && v.approved === false && isNew) d.approved = false;
      changed();
      if (again) { openForm(kind, null, true); toast('Saved. Add the next one.'); } else { closeModal(); toast('Saved'); }
    }
    form.addEventListener('submit', function (e) { e.preventDefault(); save(false); });
    m.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]'); if (!b) return;
      if (b.dataset.m === 'close') closeModal();
      if (b.dataset.m === 'again') save(true);
    });
  });
}

function sampleError(e) {
  var c = e && e.code;
  if (c === 'not_granted') return 'Claude was not allowed to help. You can allow it from the page permissions.';
  if (c === 'rate_limited') return 'Claude needs a short rest. Try again in a minute.';
  if (c === 'image_rejected') return 'Claude could not use that picture. Try a clearer photo.';
  return 'Claude could not do that now. ' + (e && e.message ? e.message : '');
}
async function readReceipts(fileList) {
  var files = Array.prototype.slice.call(fileList || []);
  if (!files.length || !online.sample || !online.images) return;
  files = files.slice(0, Math.max(1, online.images.maxCount || 1));
  ui.busyReceipt = true; toast('Claude is reading your pictures...');
  var groups = book.settings.groups.map(function (g) { return g.name + ' (' + g.type + ')'; }).join(', ');
  var prompt = 'You are the Daily Recorder for a small business. Read the attached receipt, bill or bank list pictures and turn each money event into one row.\n' +
    'Return ONLY JSON like {"rows":[{"date":"YYYY-MM-DD or empty","who":"","what":"","in":0,"out":0,"group":"","ref":"","conf":"high|medium|low"}]}.\n' +
    'Rules: Only write what you can see. Never guess. Money in OR money out on a row, never both. Use "in" for money the business received and "out" for money it paid. ' +
    '"group" must be exactly one name from this list or empty if unsure: ' + groups + '. Put an invoice or bill number in "ref" only if it is written on the paper. ' +
    'If a picture is blurry, a number is hard to read, or you are not sure, set conf to "low" and leave the unclear part empty. Dates before the year 2000 or after next year are probably misread: leave them empty.';
  try {
    var out = await online.sample.json(prompt, { images: files, modelTier: 'default', cache: false });
    var rows = (out && Array.isArray(out.rows) ? out.rows : []).slice(0, 40).map(function (r) {
      var date = /^\d{4}-\d{2}-\d{2}$/.test(r.date || '') ? r.date : '';
      var inn = Math.max(0, FH.num(r.in)), outv = Math.max(0, FH.num(r.out));
      if (inn > 0 && outv > 0) { outv = 0; r.conf = 'low'; }
      var grp = groupNames().indexOf(r.group) >= 0 ? r.group : '';
      var conf = ['high', 'medium', 'low'].indexOf(r.conf) >= 0 ? r.conf : 'low';
      return { date: date, who: String(r.who || ''), what: String(r.what || ''), in: inn, out: outv, group: grp, ref: String(r.ref || ''), conf: conf };
    }).filter(function (r) { return r.in > 0 || r.out > 0; });
    ui.busyReceipt = false;
    if (!rows.length) { toast('Claude did not find any money rows in those pictures.'); return; }
    showDrafts(rows);
  } catch (e) { ui.busyReceipt = false; toast(sampleError(e)); }
}
function showDrafts(rows) {
  var html = '<h2>Claude read ' + rows.length + ' row' + (rows.length === 1 ? '' : 's') + '</h2>' +
    '<p class="muted small" style="margin-bottom:10px">These are drafts. They are added as <b>not approved</b>. Rows that look unsure are marked NOT SURE. A person must look at the paper before approving.</p>' +
    '<div class="tablewrap"><table class="data"><thead><tr><th>Date</th><th>Who</th><th class="num">In</th><th class="num">Out</th><th>Group</th><th>Sure?</th></tr></thead><tbody>' +
    rows.map(function (r) {
      return '<tr><td>' + esc(r.date ? FH.fmtDate(r.date) : 'missing') + '</td><td>' + esc(r.who) + '<div class="small muted">' + esc(r.what) + '</div></td><td class="num">' + M(r.in) + '</td><td class="num">' + M(r.out) + '</td><td>' + esc(r.group || 'missing') + '</td><td>' + esc(r.conf) + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="btns"><button class="btn primary" type="button" data-m="add">Add these rows</button><span class="spacer"></span><button class="btn" type="button" data-m="close">Throw away</button></div>';
  openModal(html, function (m) {
    m.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]'); if (!b) return;
      if (b.dataset.m === 'close') closeModal();
      if (b.dataset.m === 'add') {
        rows.forEach(function (r) {
          var unsure = r.conf !== 'high' || !r.date || !r.group;
          book.rows.push({ id: FH.uid(), date: r.date, who: r.who, what: r.what, in: r.in, out: r.out, group: r.group, ref: r.ref, source: 'Photo read by Claude', conf: r.conf, status: unsure ? 'NOT SURE' : 'OK', approved: false, notes: '' });
        });
        closeModal(); changed(); toast(rows.length + ' rows added. Please check them.');
      }
    });
  });
}

function pill(t, cls) { return '<span class="pill ' + (cls || '') + '">' + esc(t) + '</span>'; }
function top(title, sub, actions) {

}
function btn(label, action, extra, cls) {
  return '<button class="btn ' + (cls || '') + '" type="button" data-action="' + action + '"' + (extra || '') + '>' + esc(label) + '</button>';
}
function attr(o) { return Object.keys(o).map(function (k) { return ' data-' + k + '="' + esc(o[k]) + '"'; }).join(''); }
function empty(title, text, actionHtml) { return '<div class="card empty"><b>' + esc(title) + '</b>' + esc(text) + (actionHtml ? '<div style="margin-top:12px">' + actionHtml + '</div>' : '') + '</div>'; }
function stat(k, v, n, cls) { return '<div class="stat"><div class="k">' + esc(k) + '</div><div class="v ' + (cls || '') + '">' + v + '</div>' + (n ? '<div class="n">' + n + '</div>' : '') + '</div>'; }

function dateBar(keys) {
  var L = { asOf: 'As of date', pStart: 'Period starts', pEnd: 'Period ends', start: 'Records start' };

    return '<label>' + L[k] + '<input type="date" data-set="' + k + '" value="' + esc(book.settings[k]) + '"></label>';

  if (keys.indexOf('pStart') >= 0) h += btn('This month', 'thisMonth', '', 'sm');

function exampleBanner() {
  if (!book.example) return '';
  return '<div class="banner info" style="margin-bottom:16px"><span><b>This is made-up example data</b> so you can look around. The numbers are not real.</span>' + btn('Start fresh with my own books', 'fresh', '', 'sm danger') + '</div>';

function checkPill(c) {
  if (!c.check) return '';
  if (c.check === 'OK') return pill('OK', 'good');
  var warn = /^(Possible duplicate|Over the limit|Not sure|Marked duplicate)/.test(c.check);
  return pill(c.check, warn ? 'warn' : 'bad');
}
function statusPill(x) {
  var s = x.status;
  if (s === 'Paid') return pill(s, 'good');
  if (s === 'Unpaid' || s === 'Part paid') return pill(s, x.days > 0 ? 'bad' : 'warn');
  if (s === 'Overpaid - check') return pill(s, 'bad');
  return pill(s);
}
function lateText(x) {
  if (x.days === null) return '';
  return x.days > 0 ? '<span style="color:var(--bad);font-weight:600">' + x.days + ' day' + (x.days === 1 ? '' : 's') + ' late</span>' : '<span class="mute">due in ' + (-x.days) + ' day' + (x.days === -1 ? '' : 's') + '</span>';
}

// ---------- analysis
function analysisData() {
  var s = book.settings, p = C.pl, b = C.balance, f = C.cf;
  var days = Math.max(1, FH.daysBetween(s.pStart, s.pEnd) + 1);
  var billed = 0, paid = 0, late = 0;
  C.invoices.forEach(function (x) { if (x.v.date <= s.asOf) { billed += FH.num(x.v.amount); paid += x.paid; } if (x.days > 0) late += x.owed; });
  var byCust = C.customers.slice().sort(function (a, c) { return c.billed - a.billed; });
  var totBilled = byCust.reduce(function (a, c) { return a + c.billed; }, 0);
  var months = {};
  C.crow.forEach(function (c) {
    var m = (c.r.date || '').slice(0, 7); if (!m) return;
    months[m] = months[m] || { inn: 0, out: 0 };
    if (c.kind === 'Invoice payment' || c.kind === 'Cash income') months[m].inn += FH.num(c.r.in);
    if (c.kind === 'Bill payment' || c.kind === 'Direct expense') months[m].out += FH.num(c.r.out);
  });
  var mk = Object.keys(months).sort().slice(-6);
  var spend = p.lines.map(function (l) { return { name: l.name, n: l.amount }; });
  if (Math.abs(p.other) > 0.004) spend.push({ name: 'Not sorted', n: p.other });
  spend = spend.filter(function (x) { return x.n > 0; }).sort(function (a, c) { return c.n - a.n; });
  return { days: days, billed: billed, paid: paid, late: late, byCust: byCust, totBilled: totBilled, mk: mk, months: months, spend: spend,
    margin: p.earned > 0 ? p.profit / p.earned : null, collect: billed > 0 ? paid / billed : null,
    dailySpend: p.spent / days, runway: p.spent > 0 ? b.cash / (p.spent / days) : null,
    cover: C.totalWeOwe > 0 ? (b.cash + C.totalOwedToUs) / C.totalWeOwe : null };
}
function findings(a) {
  var s = book.settings, F = [], p = C.pl, pc = function (x) { return Math.round(x * 100) + '%'; };
  function add(t, x) { F.push({ t: t, x: x }); }
  if (C.needPerson) add('bad', 'The checks found ' + C.needPerson + ' thing' + (C.needPerson === 1 ? '' : 's') + ' that need a person. Fix those first, because the numbers below may be wrong.');
  if (p.earned <= 0 && p.spent <= 0) add('warn', 'There is no money earned or spent in the period ' + FH.fmtDate(s.pStart) + ' to ' + FH.fmtDate(s.pEnd) + '. Change the period on the Profit and Loss page.');
  else if (p.profit < 0) add('bad', 'We lost ' + M(-p.profit, 1) + ' in this period. We spent more than we earned.');
  else add('good', 'We made a profit of ' + M(p.profit, 1) + ' in this period' + (a.margin !== null ? ', which is ' + pc(a.margin) + ' of what we earned.' : '.'));
  if (a.margin !== null && a.margin >= 0 && a.margin < 0.1) add('warn', 'The profit is thin (under 10% of what we earned). A small cost increase could turn it into a loss.');
  if (a.collect !== null) {
    if (a.collect < 0.6) add('bad', 'Customers have paid only ' + pc(a.collect) + ' of what we billed. Send statements and ask for payment.');
    else if (a.collect < 0.85) add('warn', 'Customers have paid ' + pc(a.collect) + ' of what we billed. Follow up on the unpaid invoices.');
    else add('good', 'Customers have paid ' + pc(a.collect) + ' of what we billed. That is healthy.');
  }
  if (a.late > 0) add('warn', M(a.late, 1) + ' is owed to us on invoices that are already late. See the Unpaid List.');
  if (a.cover !== null) {
    if (a.cover < 1) add('bad', 'Cash plus what customers owe (' + M(b2(), 1) + ') is less than the bills we owe (' + M(C.totalWeOwe, 1) + '). We may struggle to pay on time.');
    else add('good', 'Cash plus what customers owe covers our bills ' + a.cover.toFixed(1) + ' times.');
  }
  if (a.runway !== null) add(a.runway < 30 ? 'warn' : 'good', 'At the spending speed of this period (' + M(a.dailySpend, 1) + ' a day), our cash lasts about ' + Math.round(a.runway) + ' days.');
  if (a.byCust.length > 1 && a.totBilled > 0 && a.byCust[0].billed / a.totBilled > 0.5) add('warn', a.byCust[0].c.name + ' is ' + pc(a.byCust[0].billed / a.totBilled) + ' of all billing. If they leave, sales drop a lot.');
  if (a.spend.length && p.spent > 0 && a.spend[0].n / p.spent > 0.4) add('info', 'The biggest cost is ' + a.spend[0].name + ': ' + pc(a.spend[0].n / p.spent) + ' of everything we spent.');
  if (!C.cf.matches && C.cf.sameDate) add('bad', 'Cash flow does not match the balance sheet. Something is missing or doubled.');
  return F;
}

function onClick(e) {

  var a = t.dataset.action, d = t.dataset;
  switch (a) {
    case 'menu': $('#nav').classList.toggle('open'); break;
    case 'add': openForm(d.kind, null, true); break;
    case 'edit': { var it = findItem(d.kind, d.id); if (it) openForm(d.kind, it, false); break; }
    case 'del': arm(t, function () {
      var it = findItem(d.kind, d.id); if (!it) return;
      var list = book[KEY[d.kind][0]]; list.splice(list.indexOf(it), 1); changed(); toast('Deleted');
    }); break;
    case 'approveAll': {
      var n = 0; C.crow.forEach(function (c) { if (c.kind && c.check === 'OK' && c.r.approved !== true) { c.r.approved = true; n++; } });

      exportFile('statement-' + cu.id + '-' + book.settings.asOf + '.csv', toCsv(rows)); break;
    }

      C.openInv.forEach(function (x) { L.push('- ' + x.v.no + ' ' + (x.custName || 'Unknown') + ': ' + M(x.owed, 1) + ' (due ' + FH.fmtDate(x.v.due) + ')'); });
      L.push('Total: ' + M(C.totalOwedToUs, 1), '', 'Bills we owe:');
      C.openBill.forEach(function (x) { L.push('- ' + x.v.no + ' ' + x.v.who + ': ' + M(x.owed, 1) + ' (due ' + FH.fmtDate(x.v.due) + ')'); });

    }

    case 'copyNote': copyText(dailyNoteText()); break;
    case 'explain': explainProblems(); break;
    case 'copyPrompt': copyText(PROMPTS[+d.i]); break;
    case 'receipts': { var f = $('#rcpt'); if (f) f.click(); break; }

    case 'exportCsv': {
      var out = [['Date', 'Who', 'What', 'In', 'Out', 'Group', 'Invoice or bill #', 'Source', 'Sure', 'Status', 'Approved', 'Check']];
      C.crow.forEach(function (c) { var r = c.r; out.push([r.date, r.who, r.what, r.in, r.out, r.group, r.ref, r.source, r.conf, r.status, r.approved ? 'yes' : 'no', c.check]); });
      exportFile('daily-record-' + FH.isoToday() + '.csv', toCsv(out)); break;
    }
    case 'importGo': arm(t, function () {
      var ta = $('#imptext'), fi = $('#impfile');
      if (fi && fi.files && fi.files[0]) { var fr = new FileReader(); fr.onload = function () { doImport(String(fr.result)); }; fr.readAsText(fi.files[0]); }
      else if (ta && ta.value.trim()) doImport(ta.value); else toast('Choose a file or paste the backup text first.');
    }); break;
    case 'fresh': arm(t, function () { resetBook(FH.blankBook()); }); break;
    case 'example': arm(t, function () { resetBook(FH.sampleBook()); }); break;
    case 'addGroup': book.settings.groups.push({ name: 'New group', type: 'Expense' }); changed(); break;
    case 'delGroup': {

function onChange(e) {

  if (t.id === 'forder') { ui.order = t.value; refreshRows(); return; }
  if (t.id === 'fbad') { ui.onlyBad = t.checked; refreshRows(); return; }
  if (t.id === 'custSel') { ui.cust = t.value; render(); return; }
  if (t.id === 'rcpt') { readReceipts(t.files); t.value = ''; return; }
  if (t.id === 'aq') { ui.question = t.value; return; }
  if (t.id === 'imptext') { ui.importText = t.value; return; }
  if (t.hasAttribute('data-day')) { if (t.value) { ui.day = t.value; render(); } return; }
  if (t.dataset.ok) { var r = findItem('row', t.dataset.ok); if (r) { r.approved = t.checked; changed(); } return; }
  if (t.dataset.set) {
    var k = t.dataset.set;
    if (t.type === 'date' && !t.value) return;
    book.settings[k] = t.type === 'number' ? FH.num(t.value) : t.value;
    changed(); return;
  }
  if (t.dataset.me) { book.monthEnd[t.dataset.me] = FH.num(t.value); changed(); return; }
  if (t.dataset.meManual !== undefined) { book.monthEnd.manual[+t.dataset.meManual] = t.checked; changed(); return; }
  if (t.dataset.grpName !== undefined) {
    var g = book.settings.groups[+t.dataset.grpName], nn = t.value.trim(), old = g.name;
    if (!nn) { toast('A group needs a name.'); render(); return; }
    if (book.settings.groups.some(function (x, j) { return j !== +t.dataset.grpName && x.name === nn; })) { toast('That group name is already used.'); render(); return; }
    g.name = nn;
    book.rows.forEach(function (r) { if (r.group === old) r.group = nn; });
    book.bills.forEach(function (r) { if (r.group === old) r.group = nn; });
    changed(); return;
  }
  if (t.dataset.grpType !== undefined) { book.settings.groups[+t.dataset.grpType].type = t.value; changed(); return; }
}
function onInput(e) {
  if (e.target.id === 'q') { ui.q = e.target.value; refreshRows(); }
}

function boot() {
  book = loadLocal() || FH.sampleBook();
  fixBook(book);
  recalc();
  if (!localStorage_has()) saveLocal();
  route = routeFromHash();
  var root = document.createElement('div'); root.id = 'app'; document.body.appendChild(root);
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  window.addEventListener('hashchange', function () { route = routeFromHash(); window.scrollTo(0, 0); closeModal(); render(); });
  render();
  initOnline();
}
function localStorage_has() { try { return !!localStorage.getItem(LS_KEY); } catch (e) { return true; } }
boot();

})();

</script>
